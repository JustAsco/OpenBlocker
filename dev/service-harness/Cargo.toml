# Runs the background service's code (src-tauri/src/service.rs and friends)
# without Tauri, on any OS, for the API tests in dev/service_api_test.py.
# Not part of the app build.
[package]
name = "service-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5.3"
chrono = "0.4.45"
openblocker-core = { path = "../../src-tauri/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tiny_http = "0.12.0"
uuid = { version = "1.29.2", features = ["v4"] }

[workspace]
