<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Private windows · OpenBlocker</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <main>
      <img src="icons/128.png" alt="" class="logo" />
      <p class="eyebrow">Action needed</p>
      <h1>Allow OpenBlocker in private windows</h1>
      <p class="lead" id="lead">
        A block that uses the extension is running, but the extension can't see private (incognito) windows, so they'd get around it. Unless you allow it
        there, OpenBlocker closes this browser in about a minute.
      </p>
      <ol class="lead" id="steps" style="text-align: left; max-width: 30rem; margin: 1rem auto; padding-left: 1.5rem"></ol>
      <div class="actions"><button id="open">Open the extension's settings</button></div>
      <p class="quote" id="status"></p>
    </main>
    <script src="common.js"></script>
    <script src="private.js"></script>
  </body>
</html>
